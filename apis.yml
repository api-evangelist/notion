- aid: notion:notion-blocks-api
  name: Notion Blocks API
  description: >-
    Blocks are the fundamental units of content in Notion. Every page is composed of blocks, which can
    be paragraphs, headings, images, tables, lists, and many other types. Blocks can have children, forming
    a tree structure. Use these endpoints to retrieve, update, delete blocks and manage block children.
  humanURL: https://developers.notion.com
  tags:
