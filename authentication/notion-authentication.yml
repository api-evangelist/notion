schemes:
- name: bearerAuth
  type: http
  scheme: bearer
  description: Notion API uses bearer token authentication. Obtain an integration token from
    https://www.notion.so/my-integrations. Pass the token in the Authorization header as "Bearer
    {token}".
  token_types:
  - internal integration token
  - personal access token
  sources:
  - openapi/notion-openapi.yml
- name: oauth2
  type: oauth2
  description: >-
    Public connections authorize end users via OAuth 2.0 authorization code flow.
    What a token can do is governed by integration "capabilities" (read/insert/update
    content, read/insert comments, read user info) rather than granular OAuth scopes.
  flows:
  - flow: authorizationCode
    authorizationUrl: https://api.notion.com/v1/oauth/authorize
    tokenUrl: https://api.notion.com/v1/oauth/token
    refresh: true
  docs: https://developers.notion.com/guides/get-started/authorization
  capabilities_docs: https://developers.notion.com/reference/capabilities
  sources:
  - https://developers.notion.com/reference/authentication
notes:
  - The remote Notion MCP server (mcp.notion.com) requires user-based OAuth; discovery at /.well-known/oauth-authorization-server.
  - No granular OAuth scope surface — capabilities are configured per integration; scopes/ artifact intentionally omitted.
